services:
  postgres:
    image: postgres:16
    container_name: realestate_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - realestate_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: realestate_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - realestate_network

  redis:
    image: redis:7
    container_name: realestate_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - realestate_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: realestate_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - realestate_network

  centrifugo:
    image: centrifugo/centrifugo:v6
    container_name: realestate_centrifugo
    restart: always
    environment:
      - CENTRIFUGO_CLIENT_ALLOWED_ORIGINS=${FRONTEND_URL}
    volumes:
      - ./centrifugo.json:/centrifugo.json
    command: centrifugo --config=/centrifugo.json
    ports:
      - "8000:8000"
    networks:
      - realestate_network

  api:
    build: .
    container_name: realestate_api
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - CENTRIFUGO_URL=http://centrifugo:8000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - centrifugo
    networks:
      - realestate_network

volumes:
  postgres_data:

networks:
  realestate_network: